<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lidia Contreras Rodríguez</title>
    <style>
        /* Tipografía y reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff; /* Fondo blanco impoluto */
            color: #111111;           /* Texto negro elegante */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: min-content;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Contenedor principal estilizado */
        .main-container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        /* Encabezados al estilo de marca de moda */
        h2 {
            font-size: 1.8rem;
            font-weight: 300;           /* Letra fina y ligera */
            letter-spacing: 2px;        /* Espaciado de letras amplio */
            text-transform: uppercase;   /* Texto en mayúsculas */
            margin-bottom: 15px;
            color: #000000;
        }

        /* Subtítulo o texto secundario */
        h2.subtitle {
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #666666;             /* Gris neutro */
            margin-bottom: 40px;
            text-transform: none;
        }

        /* Línea separadora sutil */
        .divider {
            width: 50px;
            height: 1px;
            background-color: #000000;
            margin: 0 auto 40px auto;
        }

        /* Incrustación de video adaptable */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Relación de aspecto 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); /* Sombra suave */
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Saludo y nombre con estética de marca -->
        <h2>Lidia Contreras Rodríguez</h2>
        <div class="divider"></div>
        <h2 class="subtitle">Este es
    </div>

</body>
</html>
