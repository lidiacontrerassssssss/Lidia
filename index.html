<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lidia Contreras Rodríguez</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .main-container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h2 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
            color: #000000;
        }

        h2.subtitle {
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #666666;
            margin-bottom: 40px;
            text-transform: none;
        }

        .divider {
            width: 50px;
            height: 1px;
            background-color: #000000;
            margin: 0 auto 40px auto;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h2>Lidia Contreras Rodríguez</h2>
        <div class="divider"></div>
        <h2 class="subtitle">Este es el contenido principal de mi página web.</h2>

        <!-- Video de YouTube incrustado (ID: r38HzMkc2PM) -->
        <div class="video-container">
            <iframe 
                src="https://www.youtube.com/embed/r38HzMkc2PM" 
                title="Reproductor de video de YouTube" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

</body>
</html>

</body>
</html>
